name: Release a shared module

# Tags name the module, not the repository: cell-model-v0.8.0, elements-v0.3.0,
# cell-preview-v0.6.0, structure-panel-v0.12.0.
on:
  push:
    tags:
      - '*-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the module and version from the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG##*-v}"
          MODULE="${TAG%-v*}"
          FILE="periodic_shared/$(echo "$MODULE" | tr '-' '_').py"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MODULE=$MODULE"   >> "$GITHUB_ENV"
          echo "FILE=$FILE"       >> "$GITHUB_ENV"

      - name: Verify the file declares that version
        run: |
          test -f "$FILE" || { echo "no such module: $FILE"; exit 1; }
          DECLARED=$(python -c "
          import re, os
          text = open(os.environ['FILE'], encoding='utf-8').read()
          print(re.search(r'SHARED_MODULE_VERSION\s*=\s*[\"\'](.+?)[\"\']', text).group(1))
          ")
          echo "tag: $VERSION   file: $DECLARED"
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "ERROR: $FILE declares $DECLARED, not $VERSION"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$MODULE $VERSION" \
            --generate-notes \
            "$FILE"
