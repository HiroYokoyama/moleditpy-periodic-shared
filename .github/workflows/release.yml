name: Release shared modules

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify version and package all modules
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --title "Periodic Shared $RELEASE_TAG" \
            --generate-notes "dist/periodic-shared-$RELEASE_TAG.zip"
